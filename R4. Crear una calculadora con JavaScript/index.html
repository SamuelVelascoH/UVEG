<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora básica - Samuel Velasco Hernández</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background-color: #2c3e50;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 330px;
        }

        .calculator h2 {
            color: #ffffff;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .calculator-screen-container {
            background-color: #ecf0f1;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            text-align: right;
            word-wrap: break-word;
            word-break: break-all;
        }

        .operation-history {
            min-height: 20px;
            font-size: 0.95rem;
            color: #7f8c8d;
            font-weight: 500;
        }

        .calculator-screen {
            color: #2c3e50;
            font-size: 2.2rem;
            font-weight: bold;
            min-height: 42px;
            line-height: 42px;
        }

        .calculator-keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #ecf0f1;
            color: #2c3e50;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #d5dbdb;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background-color: #e67e22;
            color: white;
        }

        .operator:hover {
            background-color: #d35400;
        }

        .action-clear {
            background-color: #e74c3c;
            color: white;
        }

        .action-clear:hover {
            background-color: #c0392b;
        }

        .equal {
            background-color: #27ae60;
            color: white;
            grid-row: span 2;
        }

        .equal:hover {
            background-color: #219653;
        }

        .span-2 {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Calculadora básica</h2>
        <div class="calculator-screen-container">
            <div id="operation-history" class="operation-history"></div>
            <div id="display" class="calculator-screen">0</div>
        </div>
        <div class="calculator-keys">
            <button class="operator action-clear" onclick="clearCalculator()">C</button>
            <button class="operator" onclick="appendOperator('/')">&divide;</button>
            <button class="operator" onclick="appendOperator('*')">&times;</button>
            <button class="operator" onclick="appendOperator('-')">-</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('+')">+</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="equal" onclick="calculate()">=</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button onclick="appendNumber('0')" class="span-2">0</button>
            <button onclick="appendNumber('.')">.</button>
        </div>
    </div>

    <script>
        let displayValue = '0';
        let firstOperand = null;
        let waitingForSecondOperand = false;
        let pendingOperator = null;
        let fullExpression = '';

        const display = document.getElementById('display');
        const historyDisplay = document.getElementById('operation-history');

        function updateDisplay() {
            display.textContent = displayValue;
            historyDisplay.textContent = fullExpression;
        }

        function getSymbol(op) {
            switch(op) {
                case '*': return '×';
                case '/': return '÷';
                default: return op;
            }
        }

        function appendNumber(num) {
            if (num === '.' && displayValue.includes('.')) return;

            if (waitingForSecondOperand) {
                displayValue = num;
                waitingForSecondOperand = false;
            } else {
                displayValue = displayValue === '0' && num !== '.' ? num : displayValue + num;
            }
            updateDisplay();
        }

        function appendOperator(operator) {
            const inputValue = parseFloat(displayValue);
            const symbol = getSymbol(operator);

            if (pendingOperator && waitingForSecondOperand) {
                pendingOperator = operator;
                fullExpression = `${firstOperand} ${symbol}`;
                updateDisplay();
                return;
            }

            if (firstOperand === null) {
                firstOperand = inputValue;
                fullExpression = `${inputValue} ${symbol}`;
            } else if (pendingOperator) {
                const result = operate(pendingOperator, firstOperand, inputValue);
                displayValue = String(result);
                firstOperand = result;
                fullExpression = `${result} ${symbol}`;
            }

            waitingForSecondOperand = true;
            pendingOperator = operator;
            updateDisplay();
        }

        function operate(operator, a, b) {
            switch(operator) {
                case '+': return a + b;
                case '-': return a - b;
                case '*': return a * b;
                case '/': return b === 0 ? 'Error' : parseFloat((a / b).toFixed(8));
                default: return b;
            }
        }

        function calculate() {
            if (pendingOperator === null || waitingForSecondOperand) return;
            const inputValue = parseFloat(displayValue);
            const symbol = getSymbol(pendingOperator);
            
            fullExpression = `${firstOperand} ${symbol} ${inputValue} =`;
            const result = operate(pendingOperator, firstOperand, inputValue);
            
            displayValue = String(result);
            firstOperand = null;
            pendingOperator = null;
            waitingForSecondOperand = true;
            updateDisplay();
        }

        function clearCalculator() {
            displayValue = '0';
            firstOperand = null;
            waitingForSecondOperand = false;
            pendingOperator = null;
            fullExpression = '';
            updateDisplay();
        }
    </script>
</body>
</html>
